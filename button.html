function escapeHtml(text) {

  var map = {

    '&': '&amp;',

    '<': '&lt;',

    '>': '&gt;',

    '"': '&quot;',

    "'": '&#039;'

  };


  return text.replace(/[&<>"']/g, function(m) { return map[m]; });

}


function hidecode() {

$('#code').fadeOut();

$('#getbtn').fadeIn();

}



function color_change() {

  $(".basic").spectrum({

    preferredFormat: "hex",

    showPaletteOnly: true,

    togglePaletteOnly: true,

    togglePaletteMoreText: '+',

    togglePaletteLessText: '-',

    chooseText: 'OK',

    cancelText: '',

    showInput: true,

            beforeShow: function (color) {

      boxshadow = "";

      changefor = $(this).attr('data-for');

      if(changefor==".telegramim_button") { boxshadow = $(this).attr('data-boxshadow'); }

      datacolor = $(this).val();

      datacssstyle = $(this).attr('data-cssstyle');

    },

    move: function (datacolor) {

      if(boxshadow) { $(''+boxshadow+'').css('box-shadow','1px 1px 5px '+datacolor.toHexString()); }

      $(''+changefor+'').css(datacssstyle,datacolor.toHexString());

      $(this).val(datacolor.toHexString());

    },

    change: function(datacolor) {

      hidecode();

      if(boxshadow) { $(''+boxshadow+'').css('box-shadow','1px 1px 5px '+datacolor.toHexString()); }

      $(''+changefor+'').css(datacssstyle,datacolor.toHexString());

      $(this).val(datacolor.toHexString());

    }

    ,

    palette: [

    ["#000","#444","#666","#999","#ccc","#eee","#f3f3f3","#fff"],

    ["#f00","#f90","#ff0","#0f0","#0ff","#00f","#90f","#f0f"],

    ["#f4cccc","#fce5cd","#fff2cc","#d9ead3","#d0e0e3","#cfe2f3","#d9d2e9","#ead1dc"],

    ["#ea9999","#f9cb9c","#ffe599","#b6d7a8","#a2c4c9","#9fc5e8","#b4a7d6","#d5a6bd"],

    ["#e06666","#f6b26b","#ffd966","#93c47d","#76a5af","#6fa8dc","#8e7cc3","#c27ba0"],

    ["#c00","#e69138","#f1c232","#6aa84f","#45818e","#3d85c6","#674ea7","#a64d79"],

    ["#900","#b45f06","#bf9000","#38761d","#134f5c","#0b5394","#351c75","#741b47"],

    ["#600","#783f04","#7f6000","#274e13","#0c343d","#073763","#20124d","#4c1130"]

    ]

  });

}

$(document).ready(function() {

              $("input[name^='login']").on('change', function(e) {

        hidecode();

        var login = $.trim($(this).val());

        if(login[0]!="@") { login = '@'+login;}

        var regex = new RegExp(/^@[a-zA-Z]{1}(_?[a-zA-Z0-9]{1})+$/);

        if (regex.test(login)) {

          $('.errorgetbtn').remove();

          $('.telegramim_button').attr('href','https://telegram.im/'+login+'?p=1');

                      $.getJSON('check.php?login='+login,function(result){

             if(result.ok==true) {

               //view setting counter

               $("#count_add").prop("checked", false );

               $('.counter-settings').slideDown();

               $('#telegramim_count').hide().html(result.result+' пользователей');

             }

             else { $('.counter-settings,#telegramim_count').slideUp(); $("#count_add").prop("checked", false );  } //hide setting count

            });


        } else {  $('.telegramim_button').removeAttr('href'); $('.counter-settings,#telegramim_count').slideUp(); $("#count_add").prop("checked", false ); }

       });


              $("input[name^='text_button']").on('input', function(e) {

         hidecode();

         var changefor = $(this).attr('data-for');

         $("#telegramim_text_button").html(escapeHtml(this.value));

       });

              $("input[name^='title_button']").on('input', function(e) {

         hidecode();

         var changefor = $(this).attr('data-for');

         $(".telegramim_button").attr('title',escapeHtml(this.value));

       });




              $('#pulse_effect').on('change', function() { hidecode();  if($('#pulse_effect').is(':checked')) { $('.telegramim_button').addClass('telegramim_pulse'); } else { $('.telegramim_button').removeClass('telegramim_pulse'); } });



              $('#count_add').on('change', function() {

         hidecode();

         if($('#count_add').is(':checked')) {

           $('#telegramim_count').slideDown();

           if($("#ex5CurrentSliderValLabel").val()<200) { $("#ex5").slider('setValue', 200); $("#ex5CurrentSliderValLabel").val(200);   $('.telegramim_button').css({'width':'200px'}); }

         }

         else {

           $('#telegramim_count').slideUp();

         }

       });




             $("#ex5").slider({formater: function(value) {

         $("#ex5CurrentSliderValLabel").val(value);

         $('.telegramim_button').css({'width':value+'px'});

         return 'Width: '+value+' px';

       }}).on("slideStop", function(f) {

         $(this).slider('setValue', f.value);

         $('#login').blur();

         hidecode();

       });



              $("#ex6").slider({formater: function(value) {

          $("#ex6CurrentSliderValLabel").val(value);

         $('.telegramim_button').css({'font-size':value+'px'});

         return 'Size: '+value+' px';

       }}).on("slideStop", function(f) {

         $(this).slider('setValue', f.value);

         $('#login').blur();

         hidecode();

       });



              $("#ex7").slider({formater: function(value) {

         $("#ex7CurrentSliderValLabel").val(value);

         $('.telegramim_button').css({'border-radius':value+'px'});

         return 'Radius: '+value+' px';

       }}).on("slideStop", function(f) {

         $(this).slider('setValue', f.value);

         $('#login').blur();

         hidecode();

       });




              $('#getbtnform').on('submit', function(e) {

         e.preventDefault();

         $('.errorgetbtn').remove();

         $('#getbtn').hide().after('<i id="waitspin" class="ftelegramim ftelegramim-telegram ftelegramim-spin ftelegramim-3x ftelegramim-fw"></i>');


           $.post('//telegram.im/get_button_code.php', $(this).serialize())

           .done(function( result ) {

              $('#getbtn').fadeIn(); $('#waitspin').remove();

               $('#code').html(result).fadeIn();

               if(result.indexOf("errorgetbtn")<=0) { $('#getbtn').slideUp(); $('#copywidgetcode').focus().select(); }

           });

       });

});
